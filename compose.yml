name: workshop-microservices
x-app-env: &app-env
  SPRING_PROFILES_ACTIVE: docker
  CONFIG_SERVER_URL: http://config-server:8888
  CONFIG_SERVER_USER: ${CONFIG_SERVER_USER:-config}
  CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:-config-workshop}
  CONFIG_GIT_LABEL: ${CONFIG_GIT_LABEL:-main}
  JAVA_TOOL_OPTIONS: -Xms64m -Xmx384m
  RABBITMQ_USER: ${RABBITMQ_USER:-workshop}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-workshop}
services:
  config-server:
    build: spring-cloud/config-server
    image: workshop/config-server
    environment:
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx384m
      CONFIG_GIT_URI: ${CONFIG_GIT_URI:?Defina CONFIG_GIT_URI no .env conforme STEP-6}
      CONFIG_GIT_LABEL: ${CONFIG_GIT_LABEL:-main}
      CONFIG_GIT_USERNAME: ${CONFIG_GIT_USERNAME:-}
      CONFIG_GIT_PASSWORD: ${CONFIG_GIT_PASSWORD:-}
      CONFIG_SERVER_USER: ${CONFIG_SERVER_USER:-config}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:-config-workshop}
    ports: ["127.0.0.1:8888:8888"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-workshop}
      KC_HOSTNAME: http://localhost:8180
    ports: ["127.0.0.1:8180:8080"]
    volumes:
      - ./infra/keycloak/workshop-realm.json:/opt/keycloak/data/import/workshop-realm.json:ro
      - keycloak-data:/opt/keycloak/data
  rabbitmq:
    image: rabbitmq:4.1.0-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-workshop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-workshop}
    ports: ["5672:5672", "15672:15672"]
    volumes: ["rabbit-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
  mongodb:
    image: mongo:6.0.4
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
  mysql:
    image: mysql:8.0.32
    ports: ["127.0.0.1:3306:3306"]
    environment:
      MYSQL_DATABASE: review-db
      MYSQL_USER: ${MYSQL_USER:-workshop}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-workshop}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-workshop}
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD review-db -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 40
  eureka-server:
    depends_on:
      config-server:
        condition: service_healthy
    build: spring-cloud/eureka-server
    image: workshop/eureka-server
    environment:
      <<: *app-env
      SERVER_PORT: 8761
    ports: ["8761:8761"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
  gateway:
    build: spring-cloud/gateway
    image: workshop/gateway
    environment:
      <<: *app-env
      SERVER_PORT: 8080
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
  product-service:
    build: microservices/product-service
    image: workshop/product-service
    environment:
      <<: *app-env
      SERVER_PORT: 7001
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7001/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
  recommendation-service:
    build: microservices/recommendation-service
    image: workshop/recommendation-service
    environment:
      <<: *app-env
      SERVER_PORT: 7002
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7002/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
  review-service:
    build: microservices/review-service
    image: workshop/review-service
    environment:
      <<: *app-env
      SERVER_PORT: 7003
      MYSQL_USER: ${MYSQL_USER:-workshop}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-workshop}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7003/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mysql:
        condition: service_healthy
  product-composite-service:
    build: microservices/product-composite-service
    image: workshop/product-composite-service
    environment:
      <<: *app-env
      SERVER_PORT: 7100
    ports: ["7100:7100"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7100/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
volumes:
  keycloak-data:
  rabbit-data:
  mongo-data:
  mysql-data:
