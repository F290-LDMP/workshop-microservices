spring:
  application:
    name: review
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reviewsdb}
    username: ${DB_USER:reviews}
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/postgresql
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
server:
  port: ${PORT:7003}
eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  override-with-generic-response: false
