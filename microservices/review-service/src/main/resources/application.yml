spring:
  application:
    name: review-service
  datasource:
    url: ${REVIEW_DB_URL:jdbc:mysql://localhost:3306/reviewsdb}
    username: ${REVIEW_DB_USERNAME:root}
    password: ${REVIEW_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 7003

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  override-with-generic-response: false
