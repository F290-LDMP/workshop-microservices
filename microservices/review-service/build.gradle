plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${rootProject.springCloudVersion}"
        mavenBom "org.testcontainers:testcontainers-bom:1.21.4"
    }
}

dependencies {
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation project(':api')
    implementation project(':util')
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${rootProject.springdocVersion}"
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

dependencies {
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
    testImplementation 'org.testcontainers:mongodb:1.21.4'
    testImplementation 'org.testcontainers:mysql:1.21.4'
}

// Testes usam os mesmos arquivos versionados sem depender de rede/Config Server.
tasks.named('test') {
    systemProperty 'spring.application.name', 'review'
    systemProperty 'spring.cloud.config.enabled', 'false'
    systemProperty 'spring.config.location', "file:${rootProject.projectDir}/config-repo/review.yml"
}
