info:
  workshop:
    application: gateway
    profile: docker
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/workshop
          jwk-set-uri: http://keycloak:8080/realms/workshop/protocol/openid-connect/certs
