plugins {
    id 'org.springframework.boot' version '3.2.5' apply false
    id 'io.spring.dependency-management' version '1.1.4' apply false
}

allprojects {
    group = 'se.magnus'
    version = '1.0.0'

    repositories {
        mavenCentral()
    }
}

ext {
    springdocVersion = '2.5.0'
    springCloudVersion = '2023.0.1'
}
